<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spirro - Estoque PA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #485434 0%, #6b7545 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
            border-left: 8px solid #485434;
        }

        h1 {
            color: #485434;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .last-update {
            color: #666;
            font-size: 0.9em;
        }

        .btn {
            background: #485434;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn:hover {
            background: #b84f0f;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(241, 94, 0, 0.4);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            border-top: 4px solid #485434;
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-card h3 {
            color: #485434;
            font-size: 2.2em;
            margin-bottom: 5px;
        }

        .stat-card p {
            color: #666;
            font-size: 0.9em;
        }

        .movimentacoes-section {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .movimentacoes-section h2 {
            color: #485434;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .scroll-horizontal {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            padding-bottom: 15px;
            scroll-behavior: smooth;
        }

        .scroll-horizontal::-webkit-scrollbar {
            height: 8px;
        }

        .scroll-horizontal::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .scroll-horizontal::-webkit-scrollbar-thumb {
            background: #485434;
            border-radius: 10px;
        }

        .movimento-card {
            min-width: 350px;
            max-width: 380px;
            flex: 0 0 auto;
            background: linear-gradient(135deg, #fff5f0 0%, #ffe8dc 100%);
            padding: 20px;
            border-radius: 12px;
            border-left: 5px solid #485434;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
        }

        @media (max-width: 768px) {
            .movimento-card {
                min-width: 300px;
                max-width: 320px;
            }
        }

        @media (max-width: 480px) {
            .movimento-card {
                min-width: calc(100vw - 80px);
                max-width: calc(100vw - 80px);
            }
        }

        .movimento-card:hover {
            transform: scale(1.05);
        }

        .movimento-card strong {
            color: #485434;
            font-size: 1.1em;
        }

        .movimento-card .data {
            color: #666;
            font-size: 0.85em;
            margin-top: 8px;
        }

        .filters-section {
            background: white;
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .filter-group {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1em;
            transition: border 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #485434;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #485434;
        }

        .checkbox-group label {
            cursor: pointer;
            user-select: none;
            font-weight: 500;
            color: #333;
        }

        .number-input {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .number-input input {
            width: 80px;
            padding: 8px;
            border: 2px solid #ddd;
            border-radius: 8px;
            text-align: center;
            font-size: 1em;
        }

        .categories {
            display: grid;
            gap: 30px;
        }

        .category {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .category h2 {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 4px solid;
            font-size: 1.8em;
        }

        .products-scroll {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        @media (max-width: 768px) {
            .products-scroll {
                grid-template-columns: 1fr;
            }
        }

        .product-card {
            width: 100%;
            padding: 25px;
            border-radius: 15px;
            color: white;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            transition: all 0.3s;
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
        }

        .product-name {
            font-size: 1.3em;
            font-weight: 600;
            margin-bottom: 15px;
            min-height: 50px;
        }

        .product-quantity {
            font-size: 3em;
            font-weight: bold;
            margin: 15px 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .product-label {
            font-size: 0.9em;
            opacity: 0.95;
            margin-bottom: 5px;
        }

        .product-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
        }

        .product-detail {
            text-align: center;
        }

        .product-detail-label {
            font-size: 0.85em;
            opacity: 0.9;
        }

        .product-detail-value {
            font-size: 1.4em;
            font-weight: bold;
            margin-top: 5px;
        }

        .low-stock {
            border: 3px solid #FFD700;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                box-shadow: 0 5px 20px rgba(255, 215, 0, 0.5);
            }

            50% {
                box-shadow: 0 5px 30px rgba(255, 215, 0, 0.8);
            }
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .hidden {
            display: none;
        }

        .btn-scroll-top {
            position: fixed;
            bottom: 90px;
            right: 20px;
            z-index: 1000;
            background: white;
            color: #485434;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 3px solid #485434;
            cursor: pointer;
            font-size: 1.5em;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            transition: all 0.3s;
            opacity: 0;
            visibility: hidden;
        }

        .btn-scroll-top.show {
            opacity: 1;
            visibility: visible;
        }

        .btn-scroll-top:hover {
            background: #485434;
            color: white;
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(241, 94, 0, 0.5);
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>📦 Controle Produto Acabado - PULMÃO</h1>
            <p class="last-update" id="lastUpdate">Carregando...</p>
        </header>

        <div id="mainContent">
            <div class="stats" id="stats"></div>

            <div class="movimentacoes-section">
                <h2>📥 Últimas Entradas</h2>
                <div class="scroll-horizontal" id="recentEntradas">Carregando...</div>
            </div>

            <div class="movimentacoes-section">
                <h2>📤 Últimas Saídas</h2>
                <div class="scroll-horizontal" id="recentSaidas">Carregando...</div>
            </div>

            <div class="filters-section">
                <div class="filter-group">
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="🔍 Buscar matéria prima..."
                            onkeyup="filterProducts()">
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="showZerados" onchange="filterProducts()">
                        <label for="showZerados">Mostrar apenas zerados</label>
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="showBaixos" onchange="filterProducts()">
                        <label for="showBaixos">Estoque baixo ≤</label>
                        <div class="number-input">
                            <input type="number" id="limiteBaixo" value="10" min="0" onchange="filterProducts()">
                        </div>
                    </div>
                </div>
            </div>

            <div class="categories" id="categories"></div>
        </div>

        <button class="btn" onclick="loadData()" style="position: fixed; bottom: 20px; right: 20px; z-index: 1000;">🔄
            Atualizar</button>

        <button class="btn-scroll-top" id="scrollTopBtn" onclick="scrollToTop()" title="Voltar ao topo">
            ⬆️
        </button>
    </div>

    <script>
        // ========================================
        // ⚙️ CONFIGURAÇÕES - EDITE AQUI
        // ========================================

        const config = {
            // Planilha controle_mp_geral - Aba: Total_PA
            sheetId: '1rPtN3xvAWr2jz8LT-aT9Y_hs3QJxlbjXn6GLP0GNUvA',
            gidGeral: '1953407461',


            // Planilha controle_mp_entrada - Aba: FINAL
            sheetIdEntrada: '1yzB4R87MKdXqJbUJQiYsvJ9uQxlkcJuDi-Ppq2Da-Ac',
            gidEntrada: '151124392',


            // Planilha controle_mp_saida - Aba: FINAL
            sheetIdSaida: '1_8LmoLSTqfphpajyFuFqkBzR4HNj7XXVpHKF2Wj8Z6g',
            gidSaida: '1276243802',

            // ✏️ VOCÊ PODE EDITAR AQUI:
            quantidadeEntradas: 10,  // ← Número de entradas para mostrar
            quantidadeSaidas: 10,    // ← Número de saídas para mostrar
            mostrarProdutosZerados: false  // ← true = mostra zerados, false = esconde
        };

        // Paleta de cores por categoria (cores que combinam com #485434)
        const categoryCores = {
            default: [
                "#CBBE9A", // Alimentos Naturais
                "#6B7D4E", // Chás
                "#8A8F7A", // Em Vidro
                "#6A6F4E", // Encapsulados
                "#C76B2D", // Energéticos
                "#355F5B", // Essenciais
                "#9C3F2E", // Frutas
                "#8FA16A", // Funcionais
                "#5F6F73", // Garrafas
                "#8B6B55", // Pote
                "#7A5A3A", // Sementes
                "#4F4A63", // Suplementos Alimentares
                "#A8482E", // Temperos
                "#C17A5A", // Temperos Potes Novos
                "#A88A3D", // Xarope
                "#B7A84B", // Óleo
            ]
        };

        let allProducts = [];
        let categoryColorMap = {};

        function getCategoryColor(categoria, index) {
            if (!categoryColorMap[categoria]) {
                const cores = categoryCores.default;
                categoryColorMap[categoria] = cores[index % cores.length];
            }
            return categoryColorMap[categoria];
        }

        async function loadData() {
            try {
                const timestamp = new Date().getTime();
                const urlGeral = `https://docs.google.com/spreadsheets/d/${config.sheetId}/export?format=csv&gid=${config.gidGeral}&t=${timestamp}`;

                console.log('Carregando MP...');

                const response = await fetch(urlGeral, {
                    method: 'GET',
                    mode: 'cors',
                    cache: 'no-store',
                    redirect: 'follow'
                });

                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

                const csvText = await response.text();
                const rows = parseCSV(csvText);
                processData(rows);

                // Carrega ENTRADAS
                try {
                    if (config.sheetIdEntrada && config.gidEntrada) {
                        const urlEntrada = `https://docs.google.com/spreadsheets/d/${config.sheetIdEntrada}/export?format=csv&gid=${config.gidEntrada}&t=${timestamp}`;
                        const respEntrada = await fetch(urlEntrada, { method: 'GET', mode: 'cors', cache: 'no-store' });

                        if (respEntrada.ok) {
                            const csvEntrada = await respEntrada.text();
                            displayEntradas(parseCSV(csvEntrada));
                        }
                    }
                } catch (err) {
                    document.getElementById('recentEntradas').innerHTML = '<div style="color: #666; padding: 20px;">Entradas indisponíveis</div>';
                }

                // Carrega SAÍDAS
                try {
                    if (config.sheetIdSaida && config.gidSaida) {
                        const urlSaida = `https://docs.google.com/spreadsheets/d/${config.sheetIdSaida}/export?format=csv&gid=${config.gidSaida}&t=${timestamp}`;
                        const respSaida = await fetch(urlSaida, { method: 'GET', mode: 'cors', cache: 'no-store' });

                        if (respSaida.ok) {
                            const csvSaida = await respSaida.text();
                            displaySaidas(parseCSV(csvSaida));
                        }
                    }
                } catch (err) {
                    document.getElementById('recentSaidas').innerHTML = '<div style="color: #666; padding: 20px;">Saídas indisponíveis</div>';
                }

            } catch (error) {
                console.error('Erro:', error);
                document.getElementById('categories').innerHTML =
                    `<div class="error"><strong>Erro: ${error.message}</strong><br><br>
                    <button class="btn" onclick="loadData()">🔄 Tentar Novamente</button></div>`;
            }
        }

        function parseCSV(csv) {
            const lines = csv.trim().split('\n');
            const result = [];

            for (let line of lines) {
                if (!line.trim()) continue;
                const row = [];
                let currentField = '';
                let insideQuotes = false;

                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    const nextChar = line[i + 1];

                    if (char === '"' && nextChar === '"') {
                        currentField += '"';
                        i++;
                    } else if (char === '"') {
                        insideQuotes = !insideQuotes;
                    } else if (char === ',' && !insideQuotes) {
                        row.push(currentField);
                        currentField = '';
                    } else {
                        currentField += char;
                    }
                }
                row.push(currentField);
                result.push(row);
            }
            return result;
        }

        function processData(rows) {
            if (!rows || rows.length < 2) return;

            const products = [];

            for (let i = 1; i < rows.length; i++) {
                const row = rows[i];
                if (!row || row.length < 5) continue;

                const produto = row[0] ? row[0].trim() : '';
                if (!produto) continue;

                products.push({
                    produto: produto,
                    entrada: parseInt(row[1]) || 0,
                    saida: parseInt(row[2]) || 0,
                    saldo: parseInt(row[3]) || 0,
                    familia: row[4] ? row[4].trim() : 'Sem Categoria'
                });
            }

            if (products.length === 0) {
                document.getElementById('categories').innerHTML = '<div class="error">Nenhuma matéria prima encontrada.</div>';
                return;
            }

            allProducts = products;
            displayStats(products);
            displayProducts(products);

            document.getElementById('lastUpdate').textContent = `Última atualização: ${new Date().toLocaleString('pt-BR')}`;
        }

        function displayStats(products) {
            const emEstoque = products.filter(p => p.saldo > 0).length;
            const totalEstoque = products.reduce((sum, p) => sum + p.saldo, 0);
            const totalEntradas = products.reduce((sum, p) => sum + p.entrada, 0);
            const totalSaidas = products.reduce((sum, p) => sum + p.saida, 0);
            const categorias = [...new Set(products.map(p => p.familia))].length;
            const zerados = products.filter(p => p.saldo === 0).length;

            document.getElementById('stats').innerHTML = `
                <div class="stat-card">
                    <h3>${emEstoque}</h3>
                    <p>Matérias em Estoque</p>
                </div>
                <div class="stat-card">
                    <h3>${totalEstoque}</h3>
                    <p>Saldo Total</p>
                </div>
                <div class="stat-card">
                    <h3>${totalEntradas}</h3>
                    <p>Total Entradas</p>
                </div>
                <div class="stat-card">
                    <h3>${totalSaidas}</h3>
                    <p>Total Saídas</p>
                </div>
                <div class="stat-card">
                    <h3>${categorias}</h3>
                    <p>Categorias</p>
                </div>
                <div class="stat-card">
                    <h3 style="color: #FF6B35;">${zerados}</h3>
                    <p>MP Zeradas</p>
                </div>
            `;
        }

        function displayProducts(products) {
            const byCategory = {};

            products.forEach(product => {
                if (!byCategory[product.familia]) {
                    byCategory[product.familia] = [];
                }
                byCategory[product.familia].push(product);
            });

            let html = '';
            let categoryIndex = 0;

            Object.keys(byCategory).sort().forEach(categoria => {
                const cor = getCategoryColor(categoria, categoryIndex++);

                html += `
                    <div class="category" data-categoria="${categoria}">
                        <h2 style="color: ${cor}; border-color: ${cor};">${categoria}</h2>
                        <div class="products-scroll">
                `;
                //produto baixo quantidade
                byCategory[categoria].forEach(product => {
                    const lowStock = product.saldo > 0 && product.saldo <= 10 ? 'low-stock' : '';
                    html += `
                        <div class="product-card ${lowStock}" 
                             style="background: linear-gradient(135deg, ${cor} 0%, ${adjustBrightness(cor, -20)} 100%);"
                             data-product="${product.produto.toLowerCase()}"
                             data-saldo="${product.saldo}">
                            <div class="product-name">${product.produto}</div>
                            <div class="product-label">Saldo em Estoque:</div>
                            <div class="product-quantity">${product.saldo}</div>
                            <div class="product-details">
                                <div class="product-detail">
                                    <div class="product-detail-label">Entradas</div>
                                    <div class="product-detail-value">${product.entrada}</div>
                                </div>
                                <div class="product-detail">
                                    <div class="product-detail-label">Saídas</div>
                                    <div class="product-detail-value">${product.saida}</div>
                                </div>
                            </div>
                        </div>
                    `;
                });

                html += `</div></div>`;
            });

            document.getElementById('categories').innerHTML = html;
        }

        function adjustBrightness(hex, percent) {
            const num = parseInt(hex.replace('#', ''), 16);
            const amt = Math.round(2.55 * percent);
            const R = (num >> 16) + amt;
            const G = (num >> 8 & 0x00FF) + amt;
            const B = (num & 0x0000FF) + amt;
            return '#' + (0x1000000 + (R < 255 ? R < 1 ? 0 : R : 255) * 0x10000 +
                (G < 255 ? G < 1 ? 0 : G : 255) * 0x100 + (B < 255 ? B < 1 ? 0 : B : 255))
                .toString(16).slice(1);
        }

        function displayEntradas(rows) {
            if (!rows || rows.length < 2) {
                document.getElementById('recentEntradas').innerHTML = '<div style="color: #666; padding: 20px;">Nenhuma entrada</div>';
                return;
            }
            // Pega os últimos registros (mais recentes) - inverte a ordem
            const dataRows = rows.slice(1); // Remove cabeçalho
            const recentRows = dataRows.slice(-config.quantidadeEntradas).reverse(); // Pega os últimos e inverte
            //const quantidade = Math.min(config.quantidadeEntradas + 1, rows.length);
            let html = '';

            //rows.slice(1, quantidade).forEach((row, index) => {
            recentRows.forEach((row, index) => {
                if (row.length > 0 && row[0]) {
                    let dataFormatada = '';
                    let restoDados = [];

                    row.forEach(cell => {
                        if (cell && cell.trim()) {
                            if (cell.includes('/') && cell.includes(':') && cell.length > 15) {
                                const partes = cell.split(' ');
                                dataFormatada = `📅 ${partes[0]} ⏰ ${partes[1]}`;
                            } else {
                                restoDados.push(cell.trim());
                            }
                        }
                    });

                    html += `
                        <div class="movimento-card">
                            <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                                <strong>📥 Entrada ${index + 1}</strong>
                                <small class="data">${dataFormatada}</small>
                            </div>
                            <div style="color: #333;">${restoDados.join(' • ')}</div>
                        </div>
                    `;
                }
            });

            //document.getElementById('recentEntradas').innerHTML = html;
            document.getElementById('recentEntradas').innerHTML = html || '<div style="color: #666; padding: 20px;">Nenhuma entrada</div>';
        }

        function displaySaidas(rows) {
            if (!rows || rows.length < 2) {
                document.getElementById('recentSaidas').innerHTML = '<div style="color: #666; padding: 20px;">Nenhuma saída</div>';
                return;
            }
            // Pega os últimos registros (mais recentes) - inverte a ordem
            const dataRows = rows.slice(1); // Remove cabeçalho
            const recentRows = dataRows.slice(-config.quantidadeSaidas).reverse(); // Pega os últimos e inverte
            //const quantidade = Math.min(config.quantidadeSaidas + 1, rows.length);
            let html = '';

            //rows.slice(1, quantidade).forEach((row, index) => {
            recentRows.forEach((row, index) => {
            if (row.length > 0 && row[0]) {
                let dataFormatada = '';
                let restoDados = [];

                row.forEach(cell => {
                    if (cell && cell.trim()) {
                        if (cell.includes('/') && cell.includes(':') && cell.length > 15) {
                            const partes = cell.split(' ');
                            dataFormatada = `📅 ${partes[0]} ⏰ ${partes[1]}`;
                        } else {
                            restoDados.push(cell.trim());
                        }
                    }
                });

                html += `
                        <div class="movimento-card">
                            <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                                <strong>📤 Saída ${index + 1}</strong>
                                <small class="data">${dataFormatada}</small>
                            </div>
                            <div style="color: #333;">${restoDados.join(' • ')}</div>
                        </div>
                    `;
            }
        });

        //document.getElementById('recentSaidas').innerHTML = html;
        document.getElementById('recentSaidas').innerHTML = html || '<div style="color: #666; padding: 20px;">Nenhuma saída</div>';
        }

        function filterProducts() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const showZerados = document.getElementById('showZerados').checked;
            const showBaixos = document.getElementById('showBaixos').checked;
            const limiteBaixo = parseInt(document.getElementById('limiteBaixo').value) || 10;

            const categories = document.querySelectorAll('.category');

            categories.forEach(category => {
                const productCards = category.querySelectorAll('.product-card');
                let visibleCount = 0;

                productCards.forEach(card => {
                    const productName = card.getAttribute('data-product');
                    const saldo = parseInt(card.getAttribute('data-saldo'));

                    let show = true;

                    // Filtro de busca
                    if (searchTerm && !productName.includes(searchTerm)) {
                        show = false;
                    }

                    // Filtro de zerados
                    if (showZerados && saldo !== 0) {
                        show = false;
                    }

                    // Filtro de baixos
                    if (showBaixos && saldo > limiteBaixo) {
                        show = false;
                    }

                    if (show) {
                        card.style.display = 'block';
                        visibleCount++;
                    } else {
                        card.style.display = 'none';
                    }
                });

                // Esconde categoria se não tem produtos visíveis
                category.style.display = visibleCount > 0 ? 'block' : 'none';
            });
        }

        function scrollToTop() {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        }

        // Mostra/esconde botão de scroll baseado na posição da página
        window.addEventListener('scroll', function () {
            const scrollTopBtn = document.getElementById('scrollTopBtn');
            if (window.pageYOffset > 300) {
                scrollTopBtn.classList.add('show');
            } else {
                scrollTopBtn.classList.remove('show');
            }
        });

        setInterval(loadData, 300000);
        loadData();
    </script>
</body>
